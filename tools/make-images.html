<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>앱 이미지 생성</title>
<!-- 아이콘·공유 이미지를 만드는 페이지. #icon 또는 #og 로 열고 화면을 캡처해요. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
html,body{margin:0;overflow:hidden;background:#FFF6F4;font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif}
#out>svg{display:block;width:100vw;height:100vh}
.og{width:1200px;height:630px;display:flex;background:linear-gradient(120deg,#FFF6F4 0%,#FBE7ED 100%)}
.og .txt{flex:1;padding:96px 0 0 84px;color:#1D191B}
.og h1{font-size:84px;font-weight:800;letter-spacing:-.045em;margin:0 0 22px}
.og p{font-size:31px;line-height:1.45;color:#5E5559;margin:0;letter-spacing:-.02em;font-weight:500}
.og .steps{display:flex;gap:10px;margin-top:44px}
.og .steps span{font-size:22px;font-weight:650;padding:10px 18px;border-radius:999px;background:#fff;color:#8A3E58}
.og .url{position:absolute;left:84px;bottom:64px;font-size:22px;color:#9A8F93;font-weight:550}
.og svg{width:560px;height:630px;display:block}
iframe{position:absolute;width:10px;height:10px;opacity:0;border:0;pointer-events:none}
</style>
</head>
<body>
<div id="out"></div>
<iframe id="f" src="../index.html"></iframe>
<script>
const f=document.getElementById('f');
f.onload=()=>{
  const w=f.contentWindow,d=f.contentDocument;
  const defs=d.querySelector('svg defs').innerHTML;
  const sk=w.skyFor(12),seed=12345,T=w.buildTree(seed);
  const tree=w.groundBack(1,sk)+w.plantSVG(1,seed)+w.groundFront(1,T,sk);
  const sky=`<linearGradient id="isky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#F8D6E0"/><stop offset=".75" stop-color="#FFF3F1"/></linearGradient>`;
  if(location.hash==='#og'){
    document.getElementById('out').innerHTML=`<div class="og"><div class="txt"><h1>벚꽃 체중</h1>
      <p>매일 아침 체중을 기록하면<br>목표에 가까워질수록 벚나무가 자라요.</p>
      <div class="steps"><span>씨앗</span><span>어린 나무</span><span>꽃눈</span><span>만개</span></div>
      <div class="url">charaing.github.io/sakura-weight</div></div>
      <svg viewBox="0 0 560 630"><defs>${defs}${sky}</defs><rect width="560" height="630" fill="url(#isky)"/>
      <path d="M0 470C120 440 260 452 380 446S520 436 560 444V630H0Z" fill="#D3E3C7"/>
      <path d="M0 540Q280 512 560 540V630H0Z" fill="#B7CE9C"/>
      <g transform="translate(290 552) scale(1.78)">${tree}</g></svg></div>`;
  }else{
    document.getElementById('out').innerHTML=`<svg viewBox="0 0 512 512" preserveAspectRatio="xMidYMid slice"><defs>${defs}${sky}</defs>
      <rect width="512" height="512" fill="url(#isky)"/>
      <path d="M0 418Q256 384 512 418V512H0Z" fill="#B7CE9C"/>
      <g transform="translate(256 440) scale(1.36)">${tree}</g></svg>`;
  }
  document.body.dataset.ready='1';
};
</script>
</body>
</html>
